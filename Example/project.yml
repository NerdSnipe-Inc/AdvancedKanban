name: AdvancedKanbanExample
options:
  bundleIdPrefix: com.nerdsnipe.advancedkanban
packages:
  AdvancedKanban:
    path: ..
targets:
  AdvancedKanbanExample:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources: [AdvancedKanbanExample]
    dependencies:
      - package: AdvancedKanban
        product: AdvancedKanban
      - package: AdvancedKanban
        product: AdvancedKanbanSwiftData
    info:
      path: AdvancedKanbanExample/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nerdsnipe.advancedkanban.example
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AdvancedKanbanExample (macOS):
    build:
      targets:
        AdvancedKanbanExample_macOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
  AdvancedKanbanExample (iOS):
    build:
      targets:
        AdvancedKanbanExample_iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
